version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: school_mdm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school_mdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_mdm_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-school_mdm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - school_mdm_pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school_mdm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: school_mdm_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - school_mdm_redisdata:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  school_mdm_pgdata:
  school_mdm_redisdata:
