# Nginx Internal HTTPS Reverse Proxy Configuration (mdm.school.local)
# Avoids port 8443 conflict on host by serving standard HTTPS on port 443.

upstream school_api {
    server 127.0.0.1:4000;
}

upstream school_web {
    server 127.0.0.1:5173;
}

server {
    listen 80;
    server_name mdm.school.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mdm.school.local;

    ssl_certificate     /etc/nginx/certs/mdm.school.local.crt;
    ssl_certificate_key /etc/nginx/certs/mdm.school.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Backend REST API
    location /api/ {
        proxy_pass http://school_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime Socket.IO
    location /socket.io/ {
        proxy_pass http://school_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend Portal
    location / {
        proxy_pass http://school_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
